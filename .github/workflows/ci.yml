name: FluentHub CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/assets/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - '.github/assets/**'
      - 'docs/**'
      - '*.md'

run-name: ${{ github.event_name == 'pull_request' && 'FluentHub PR Validation' || 'FluentHub CI Validation' }}

env:
  WORKING_DIR:                   '${{ github.workspace }}' # Default: 'D:\a\FluentHub\FluentHub'
  APP_PACKAGE_DIR:               '${{ github.workspace }}\src\FluentHub\AppPackages\'
  APP_PROJECT_PATH:              '${{ github.workspace }}\src\FluentHub\FluentHub.csproj'
  APP_MANIFEST_PATH:             '${{ github.workspace }}\src\FluentHub\Package.appxmanifest'
  APP_CREDENTIALS_PATH:          '${{ github.workspace }}\src\FluentHub\AppCredentials.config'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Run unit tests
      run: dotnet test --project tests/FluentHub.Tests/FluentHub.Tests.csproj -c ${{ matrix.configuration }}

  build:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64, arm64]
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      PLATFORM: ${{ matrix.platform }}

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Prepare CI app credentials
      shell: pwsh
      run: |
        $examplePath = "$env:APP_CREDENTIALS_PATH.example"
        $contents = [IO.File]::ReadAllText($examplePath).Replace("YOUR-APP-ID", "ci-validation-client-id")
        [IO.File]::WriteAllText($env:APP_CREDENTIALS_PATH, $contents, [Text.UTF8Encoding]::new($false))

    - name: Build FluentHub
      run: |
        cd $env:WORKING_DIR\src

        & "$env:WORKING_DIR\.github\scripts\Build-App.ps1" `
          -Platform $env:PLATFORM `
          -Configuration $env:CONFIGURATION `
          -PackageManifestPath $env:APP_MANIFEST_PATH

    - name: Upload the packages to the Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 'Appx Packages (${{ env.CONFIGURATION }}, ${{ env.PLATFORM }})'
        path: ${{ env.APP_PACKAGE_DIR }}
