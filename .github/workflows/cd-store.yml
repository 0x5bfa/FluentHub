name: FluentHub CD (Store)

on:
  workflow_dispatch:
    inputs:
      submit:
        description: 'Submit the prepared draft to Microsoft Store certification.'
        required: true
        default: false
        type: boolean
      replace_existing_draft:
        description: 'Replace an existing Partner Center draft. Keep disabled unless that draft can be discarded.'
        required: true
        default: false
        type: boolean
      flight_id:
        description: 'Optional Microsoft Store flight ID. Store listings are not updated for flights.'
        required: false
        type: string
      rollout_percentage:
        description: 'Optional package rollout percentage. Leave empty for the Store default.'
        required: false
        type: string
      artifact_run_id:
        description: 'Optional prior Store workflow run ID whose package artifact should be reused.'
        required: false
        type: string
      source_pr:
        description: 'Optional pull request number that produced the submitted package.'
        required: false
        type: string

run-name: 'FluentHub CD (Store)'

permissions:
  contents: read
  actions: read
  deployments: write
  issues: write
  pull-requests: write

concurrency:
  group: microsoft-store-production
  cancel-in-progress: false

jobs:
  build:
    if: github.repository_owner == '0x5bfa' && inputs.artifact_run_id == ''
    runs-on: windows-latest
    env:
      APPX_BUNDLE_PLATFORMS:         'x64|arm64'
      CONFIGURATION:                 'Release'
      PLATFORM:                      'x64'
      WORKING_DIR:                   '${{ github.workspace }}'
      APP_PACKAGE_DIR:               '${{ github.workspace }}\src\FluentHub\AppPackages\'
      APP_PROJECT_PATH:              '${{ github.workspace }}\src\FluentHub\FluentHub.csproj'
      APP_MANIFEST_PATH:             '${{ github.workspace }}\src\FluentHub\Package.appxmanifest'
      STORE_LISTINGS_DIR:            '${{ github.workspace }}\.github\msstore-config\Listings'
      STORE_LOCALES_PATH:            '${{ github.workspace }}\.github\msstore-config\locales.json'
      PACKAGE_CERTIFICATE_PATH:      '${{ github.workspace }}\.github\TempCertificate.pfx'

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
    - name: Setup .NET
      uses: actions/setup-dotnet@v4

    - name: Validate Microsoft Store listings
      shell: pwsh
      run: |
        & "$env:WORKING_DIR\.github\scripts\Validate-MicrosoftStoreListings.ps1" `
          -ListingsPath $env:STORE_LISTINGS_DIR `
          -LocalesPath $env:STORE_LOCALES_PATH

    - name: Generate temporary Store package certificate
      shell: pwsh
      run: |
        & "$env:WORKING_DIR\.github\scripts\Generate-SelfCertPfx.ps1" `
          -Destination $env:PACKAGE_CERTIFICATE_PATH `
          -Publisher "CN=4E3C0825-4D00-4ECC-89F8-528E9200B125"

    - name: Build and package FluentHub
      shell: pwsh
      run: |
        Set-Location "$env:WORKING_DIR\src"

        & "$env:WORKING_DIR\.github\scripts\Build-App.ps1" `
          -Platform $env:PLATFORM `
          -Configuration $env:CONFIGURATION `
          -IsStorePublish $true `
          -PackageManifestPath $env:APP_MANIFEST_PATH `
          -PackageCertificateKeyFile $env:PACKAGE_CERTIFICATE_PATH `
          -AppxBundlePlatforms $env:APPX_BUNDLE_PLATFORMS

    - name: Verify Store package
      shell: pwsh
      run: |
        $package = Get-ChildItem -Path $env:APP_PACKAGE_DIR -Recurse -File -Include *.msixupload, *.msixbundle, *.msix |
          Sort-Object `
            @{
              Expression = {
                switch ($_.Extension.ToLowerInvariant())
                {
                  ".msixupload" { 0 }
                  ".msixbundle" { 1 }
                  ".msix" { 2 }
                  default { 3 }
                }
              }
              Ascending = $true
            },
            @{
              Expression = "LastWriteTimeUtc"
              Descending = $true
            } |
          Select-Object -First 1

        if ($null -eq $package)
        {
          throw "No Store package was found under '$env:APP_PACKAGE_DIR'."
        }

        Write-Host "Found Store package: $($package.FullName)"

    - name: Upload the Store package
      uses: actions/upload-artifact@v4
      with:
        name: FluentHub Store package
        path: ${{ env.APP_PACKAGE_DIR }}
        if-no-files-found: error
        retention-days: 14

  validate-release:
    needs: build
    if: >-
      always() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
          - architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      STORE_ARTIFACT_DIR:             '${{ github.workspace }}\artifacts\store'
      VALIDATION_RESULTS_DIR:         '${{ github.workspace }}\TestResults\StoreValidation'

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4

    - name: Download the Store package
      uses: actions/download-artifact@v4
      with:
        name: FluentHub Store package
        path: ${{ env.STORE_ARTIFACT_DIR }}
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.artifact_run_id || github.run_id }}

    - name: Find sideload validation package
      id: validation-package
      shell: pwsh
      run: |
        $bundle = Get-ChildItem -Path $env:STORE_ARTIFACT_DIR -Recurse -File -Filter *.msixbundle |
          Where-Object { $_.DirectoryName -like "*_Test*" } |
          Sort-Object LastWriteTimeUtc -Descending |
          Select-Object -First 1
        $certificate = Get-ChildItem -Path $env:STORE_ARTIFACT_DIR -Recurse -File -Filter *.cer |
          Where-Object { $_.DirectoryName -like "*_Test*" } |
          Sort-Object LastWriteTimeUtc -Descending |
          Select-Object -First 1

        if ($null -eq $bundle)
        {
          throw "The Store artifact does not contain a sideload .msixbundle in a _Test directory. Rebuild it with StoreUpload mode."
        }

        if ($null -eq $certificate)
        {
          throw "The Store artifact does not contain the certificate for its sideload validation package."
        }

        "bundle_path=$($bundle.FullName)" >> $env:GITHUB_OUTPUT
        "certificate_path=$($certificate.FullName)" >> $env:GITHUB_OUTPUT
        Write-Host "Validation bundle: $($bundle.FullName)"

    - name: Run Windows App Certification Kit
      shell: pwsh
      run: |
        & "$env:GITHUB_WORKSPACE\.github\scripts\Invoke-WindowsAppCertificationKit.ps1" `
          -PackagePath '${{ steps.validation-package.outputs.bundle_path }}' `
          -CertificatePath '${{ steps.validation-package.outputs.certificate_path }}' `
          -ReportPath "$env:VALIDATION_RESULTS_DIR\WackReport.xml"

    - name: Install and launch the Release package
      shell: pwsh
      run: |
        & "$env:GITHUB_WORKSPACE\.github\scripts\Test-PackagedAppStartup.ps1" `
          -PackagePath '${{ steps.validation-package.outputs.bundle_path }}' `
          -CertificatePath '${{ steps.validation-package.outputs.certificate_path }}' `
          -PackageName '49462fluenthub-uwp.FluentHub' `
          -Architecture '${{ matrix.architecture }}' `
          -DiagnosticsPath $env:VALIDATION_RESULTS_DIR

    - name: Upload validation diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: 'Store validation (${{ matrix.architecture }})'
        path: ${{ env.VALIDATION_RESULTS_DIR }}
        if-no-files-found: ignore
        retention-days: 14

  deploy:
    needs:
      - build
      - validate-release
    if: >-
      always() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      needs.validate-release.result == 'success'
    runs-on: ubuntu-latest
    environment: microsoft-store
    env:
      STORE_ARTIFACT_DIR:             '${{ github.workspace }}/artifacts/store'
      APP_MANIFEST_PATH:              '${{ github.workspace }}/src/FluentHub/Package.appxmanifest'
      STORE_LISTINGS_DIR:             '${{ github.workspace }}/.github/msstore-config/Listings'
      STORE_LOCALES_PATH:             '${{ github.workspace }}/.github/msstore-config/locales.json'
      STORE_PRODUCT_ID:               "${{ vars.MICROSOFT_STORE_PRODUCT_ID || '9NKB9HX8RJZ3' }}"
      STORE_RELEASE_NOTES_DIR:        '${{ github.workspace }}/.github/release-notes'
      STORE_FLIGHT_ID:                '${{ inputs.flight_id }}'
      STORE_ROLLOUT_PERCENTAGE:       '${{ inputs.rollout_percentage }}'
      STORE_SUBMISSION_METADATA_PATH: '${{ github.workspace }}/artifacts/store-submission.json'

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4

    - name: Download the Store package
      uses: actions/download-artifact@v4
      with:
        name: FluentHub Store package
        path: ${{ env.STORE_ARTIFACT_DIR }}
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.artifact_run_id || github.run_id }}

    - name: Find Store package
      id: package
      shell: pwsh
      run: |
        $package = Get-ChildItem -Path $env:STORE_ARTIFACT_DIR -Recurse -File -Include *.msixupload, *.msixbundle, *.msix |
          Sort-Object `
            @{
              Expression = {
                switch ($_.Extension.ToLowerInvariant())
                {
                  ".msixupload" { 0 }
                  ".msixbundle" { 1 }
                  ".msix" { 2 }
                  default { 3 }
                }
              }
              Ascending = $true
            },
            @{
              Expression = "LastWriteTimeUtc"
              Descending = $true
            } |
          Select-Object -First 1

        if ($null -eq $package)
        {
          throw "No Store package was found under '$env:STORE_ARTIFACT_DIR'."
        }

        "package_path=$($package.FullName)" >> $env:GITHUB_OUTPUT
        Write-Host "Found Store package: $($package.FullName)"

    - name: Resolve source commit and pull request
      id: source
      if: inputs.submit
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        REQUESTED_SOURCE_PR: ${{ inputs.source_pr }}
      run: |
        $sourceSha = '${{ github.sha }}'
        $sourcePullRequest = $env:REQUESTED_SOURCE_PR.Trim()

        if (-not [string]::IsNullOrWhiteSpace($sourcePullRequest) -and
            $sourcePullRequest -notmatch '^[1-9]\d*$')
        {
          throw "source_pr must be a positive pull request number."
        }

        if (-not [string]::IsNullOrWhiteSpace($env:ARTIFACT_RUN_ID))
        {
          $sourceRun = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:ARTIFACT_RUN_ID" | ConvertFrom-Json
          $sourceSha = [string]$sourceRun.head_sha
        }

        if ([string]::IsNullOrWhiteSpace($sourceSha))
        {
          throw "The source commit could not be resolved."
        }

        if ([string]::IsNullOrWhiteSpace($sourcePullRequest))
        {
          $pullRequests = @(gh api "repos/$env:GITHUB_REPOSITORY/commits/$sourceSha/pulls" | ConvertFrom-Json)
          $sourcePullRequest = [string]($pullRequests |
            Sort-Object updated_at -Descending |
            Select-Object -First 1 -ExpandProperty number)
        }

        "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT
        "source_pr=$sourcePullRequest" >> $env:GITHUB_OUTPUT
        Write-Host "Submission source: $sourceSha (PR: $sourcePullRequest)"

    - name: Setup Microsoft Store Developer CLI
      uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0
      with:
        version: v0.3.9

    - name: Setup Linux credential store
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          dbus \
          dbus-x11 \
          gnome-keyring \
          libsecret-1-0

    - name: Prepare Microsoft Store submission
      shell: bash
      run: |
        dbus-run-session -- bash -euo pipefail -c '
          keyring_env="$(printf '\''\n'\'' | gnome-keyring-daemon --unlock)"
          eval "$keyring_env"
          pwsh -NoLogo -NoProfile -File "$GITHUB_WORKSPACE/.github/scripts/Run-MicrosoftStoreSubmission.ps1"
        '
      env:
        STORE_PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
        STORE_SUBMIT: ${{ inputs.submit }}
        STORE_REPLACE_EXISTING_DRAFT: ${{ inputs.replace_existing_draft }}
        PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
        PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
        PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}

    - name: Register Store certification deployment
      id: certification-deployment
      if: inputs.submit
      shell: pwsh
      run: |
        & "$env:GITHUB_WORKSPACE/.github/scripts/Register-MicrosoftStoreDeployment.ps1" `
          -SubmissionMetadataPath $env:STORE_SUBMISSION_METADATA_PATH `
          -Repository $env:GITHUB_REPOSITORY `
          -GitHubToken $env:GH_TOKEN `
          -SourceSha '${{ steps.source.outputs.source_sha }}' `
          -SourcePullRequest '${{ steps.source.outputs.source_pr }}' `
          -WorkflowRunUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
      env:
        GH_TOKEN: ${{ github.token }}
